name: Send Loan Notifications

on:
  schedule:
    - cron: "0 4 * * 1,4" # 7:00 AM EAT every Monday and Thursday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: send-loan-notifications
  cancel-in-progress: false

env:
  DEBUG: "False"
  DJANGO_ENV: "production"
  DATABASE_SSL_REQUIRE: "true"
  SECURE_SSL_REDIRECT: "false"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  send_loan_notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Validate required secrets
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          BOO_EMAIL: ${{ secrets.BOO_EMAIL }}
          HOF_EMAIL: ${{ secrets.HOF_EMAIL }}
        run: |
          missing=0
          for name in SECRET_KEY DATABASE_URL REDIS_URL EMAIL_HOST_USER EMAIL_HOST_PASSWORD BOO_EMAIL HOF_EMAIL; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::$name is required for loan notifications"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Django configuration
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          BOO_EMAIL: ${{ secrets.BOO_EMAIL }}
          HOF_EMAIL: ${{ secrets.HOF_EMAIL }}
          PROGS_ADMIN_EMAIL: ${{ secrets.PROGS_ADMIN_EMAIL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          mkdir -p logs
          python manage.py check

      - name: Run Loan Notifications Command
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          BOO_EMAIL: ${{ secrets.BOO_EMAIL }}
          HOF_EMAIL: ${{ secrets.HOF_EMAIL }}
          PROGS_ADMIN_EMAIL: ${{ secrets.PROGS_ADMIN_EMAIL }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          for attempt in 1 2 3; do
            echo "Loan notification attempt ${attempt}/3"
            if python manage.py send_loan_notifications --verbosity=2; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1
