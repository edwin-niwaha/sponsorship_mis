# .github/workflows/update-loan-statuses.yml
name: Update Loan Statuses

on:
  schedule:
    - cron: "30 4 * * *"   # Runs daily at 4:30 AM UTC → 7:30 AM EAT
  workflow_dispatch:       # Allows manual run from GitHub UI

jobs:
  update_loan_statuses:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Loan Status Update Command
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEBUG: "False"
        run: |
          python manage.py update_loan_statuses