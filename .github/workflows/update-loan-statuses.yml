name: Update Loan Statuses

on:
  schedule:
    - cron: "0 4 * * *" # Runs daily at 4:00 AM UTC, 7:00 AM EAT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-loan-statuses
  cancel-in-progress: false

env:
  DEBUG: "False"
  DJANGO_ENV: "production"
  DATABASE_SSL_REQUIRE: "true"
  SECURE_SSL_REDIRECT: "false"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update_loan_statuses:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Validate required secrets
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          missing=0
          for name in SECRET_KEY DATABASE_URL REDIS_URL; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing secret::$name is required for loan status updates"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Django configuration
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          mkdir -p logs
          python manage.py check

      - name: Run Loan Status Update Command
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          for attempt in 1 2 3; do
            echo "Loan status update attempt ${attempt}/3"
            if python manage.py update_loan_statuses --verbosity=2; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1
