<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate to Pendeza Uganda</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{% static 'css/donation.css' %}" rel="stylesheet">
  <style>
    body {
      background: url("{% static 'images/kids.jpg' %}") no-repeat center center/cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      backdrop-filter: brightness(0.6);
    }
  </style>
</head>
<body>

  <div class="donation-card">

    <!-- Header -->
    <div class="text-center mb-3">
      <div class="logo-text">Pendeza Uganda</div>
      <small class="text-muted">Transform Lives Today</small>
    </div>
    <hr class="opacity-25">

    {% if messages %}
      <div id="top-alert-container">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} d-flex align-items-center shadow-lg border-0 py-2 px-3" style="border-radius: 12px;">
            <div class="spinner-border spinner-border-sm me-3" id="alert-spinner"></div>
            <span class="fw-semibold">{{ message }}</span>
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="POST" id="donationForm" novalidate>
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label small text-primary fw-semibold">Full Name (Optional)</label>
        <input type="text" name="name" class="form-control form-control-sm rounded-3">
      </div>

      <div class="mb-3">
        <label class="form-label small text-primary fw-semibold">Email (Optional)</label>
        <input type="email" name="email" class="form-control form-control-sm rounded-3">
      </div>

      <div class="mb-3">
        <label class="form-label small text-primary fw-semibold">Phone Number <span class="text-danger">*</span>
          <img src="{% static 'images/mtn-logo.png' %}" alt="MTN" height="22" />
        </label>
        <input type="tel" name="phone" class="form-control form-control-sm rounded-3" placeholder="07XXXXXXXX" pattern="07[0-9]{8}" required>
        <div class="invalid-feedback">Start with 07, total 10 digits.</div>
      </div>

      <div class="mb-2">
        <label class="form-label small text-primary fw-semibold">Amount (UGX) *</label>
        <input type="number" name="amount" id="amount" class="form-control form-control-sm rounded-3 mb-2" min="5000" required placeholder="Min 5,000 UGX">

        <div class="row g-1">
          <div class="col-6"><button type="button" class="btn btn-outline-secondary w-100" onclick="setAmount(70000)">70K (1 mo)</button></div>
          <div class="col-6"><button type="button" class="btn btn-outline-secondary w-100" onclick="setAmount(280000)">280K (1 term)</button></div>
          <div class="col-6"><button type="button" class="btn btn-outline-secondary w-100" onclick="setAmount(420000)">420K (2 terms)</button></div>
          <div class="col-6"><button type="button" class="btn btn-outline-secondary w-100" onclick="setAmount(840000)">840K (1 yr)</button></div>
        </div>

        <div class="invalid-feedback">Minimum is 5,000 UGX.</div>
      </div>

      <button type="submit" id="donateBtn" class="btn btn-primary w-100 text-white mt-3 py-2 rounded-3" disabled>
        Donate Now
      </button>
    </form>

    <div class="text-center small text-muted mt-3">
      &copy; <span id="year"></span> Pendeza Uganda<br>
          Built with love by <a href="https://perpetual-web-vert.vercel.app/" target="_blank" class="text-success text-decoration-none fw-semibold">Perpetual Labs</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const form = document.getElementById("donationForm");
    const phone = document.querySelector('[name="phone"]');
    const amount = document.getElementById("amount");
    const btn = document.getElementById("donateBtn");

    function validate() {
      const validPhone = /^07\d{8}$/.test(phone.value);
      const validAmount = parseInt(amount.value) >= 5000;
      btn.disabled = !(validPhone && validAmount);
      phone.classList.toggle('is-invalid', phone.value && !validPhone);
      amount.classList.toggle('is-invalid', amount.value && !validAmount);
    }

    function setAmount(val) {
      amount.value = val;
      validate();
    }

    [phone, amount].forEach(el => el.addEventListener("input", validate));

    form.addEventListener("submit", () => {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Processing...';
    });
  </script>
</body>
</html>
