{% extends 'accounts/base.html' %}
{% load crispy_forms_tags %}
{% load humanize %}
{% load static %}

{% block content %}
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7 col-sm-10">
        <div class="card shadow border-0 rounded-4">
          <!-- Card Header -->
          <div class="card-header bg-gradient text-blue text-center rounded-top-4 py-2" style="background: linear-gradient(135deg, #0d6efd, #0b5ed7);">
            <h5 class="mb-0 fw-semibold">💝 Make a Donation</h5>
          </div>

          <!-- Card Body -->
          <div class="card-body p-4">
            <form method="post" action="{% url 'donation_form' %}" class="needs-validation" novalidate>
              {% csrf_token %}

              {% if form.non_field_errors %}
                <div class="alert alert-danger small py-2 mb-3" role="alert">{{ form.non_field_errors }}</div>
              {% endif %}

              <div class="small">{{ form|crispy }}</div>

              <div class="d-grid mt-3">
                <button type="submit" class="btn btn-primary btn-sm rounded-3 fw-semibold shadow-sm">Donate Now</button>
              </div>
            </form>
          </div>
        </div>

        <!-- Small Note -->
        <div class="text-center mt-3 text-muted small">Your support makes a difference ✨</div>
      </div>
    </div>
  </div>
{% endblock %}
