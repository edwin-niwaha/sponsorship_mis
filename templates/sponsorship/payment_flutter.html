{% extends 'accounts/base.html' %}
{% load static %}

{% block title %}Pendeza Connect | Sponsor Pendeza Uganda{% endblock %}

{% block content %}
  <div class="container py-4">
    <!-- Payment Form Section -->
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8 col-sm-12">
        <div class="card shadow border-0 rounded-3">
          <!-- Card Header -->
          <div class="card-header bg-primary text-white text-center rounded-top-3">
            <h4 class="fw-bold mb-0">Donate Now</h4>
          </div>

          <!-- Card Body -->
          <div class="card-body p-4">
            {% if error %}
              <div class="alert alert-danger alert-dismissible fade show" role="alert">
                {{ error }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endif %}
            <form method="POST" action="{% url 'initiate_payment' %}">
              {% csrf_token %}
              <div class="mb-3">
                <label for="email" class="form-label fw-bold">Email</label>
                <input type="email" id="email" name="email" value="{{ request.user.email|default:'' }}" class="form-control" placeholder="Enter your email" required />
              </div>
              <div class="mb-3">
                <label for="total_amount" class="form-label fw-bold">Amount (UGX)</label>
                <input type="number" id="total_amount" name="total_amount" step="0.01" class="form-control" placeholder="Enter amount" required />
              </div>
              <button type="submit" class="btn btn-primary w-100">Donate</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
