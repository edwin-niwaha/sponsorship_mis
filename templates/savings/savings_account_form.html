{% extends 'savings/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
  <style>
    .client-search-field {
      margin-bottom: .5rem;
    }

    .client-search-summary {
      color: #6b7280;
      display: block;
      font-size: .8rem;
      margin-top: .25rem;
    }

    .client-search-empty {
      color: #b91c1c;
    }
  </style>
  <div class="container">
    <div class="page-header flex-wrap">
      <h3 class="mb-0">{{ form_name|upper }}</h3>
      <a href="{% url 'savings_account_list' %}" class="btn btn-sm btn-success">Savings Accounts</a>
    </div>
    <div class="card shadow-lg border-0 mt-3 mb-5">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-dark btn-block mt-3">Save Account</button>
        </form>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var clientSelect = document.querySelector('select[data-client-search-select="true"]');

      if (!clientSelect || clientSelect.type === 'hidden') {
        return;
      }

      var options = Array.prototype.slice.call(clientSelect.options).map(function (option) {
        return {
          option: option,
          text: option.text.toLowerCase(),
          value: option.value.toLowerCase(),
          isPlaceholder: option.value === ''
        };
      });
      var searchableOptions = options.filter(function (item) {
        return !item.isPlaceholder;
      });

      var searchInput = document.createElement('input');
      searchInput.type = 'search';
      searchInput.className = 'form-control client-search-field';
      searchInput.placeholder = 'Search by client name or registration number';
      searchInput.setAttribute('aria-label', 'Search clients');
      searchInput.autocomplete = 'off';

      var summary = document.createElement('small');
      summary.className = 'client-search-summary';

      clientSelect.parentNode.insertBefore(searchInput, clientSelect);
      clientSelect.parentNode.insertBefore(summary, clientSelect.nextSibling);

      function updateSummary(count, query) {
        if (query && count === 0) {
          summary.textContent = 'No matching clients found.';
          summary.classList.add('client-search-empty');
          return;
        }

        summary.textContent = count + ' client' + (count === 1 ? '' : 's') + ' available';
        summary.classList.remove('client-search-empty');
      }

      function filterClients() {
        var query = searchInput.value.trim().toLowerCase();
        var visibleCount = 0;
        var selectedOptionHidden = false;

        options.forEach(function (item) {
          if (item.isPlaceholder) {
            item.option.hidden = false;
            return;
          }

          var isVisible = !query || item.text.indexOf(query) !== -1 || item.value.indexOf(query) !== -1;
          item.option.hidden = !isVisible;
          item.option.disabled = !isVisible;

          if (isVisible) {
            visibleCount += 1;
          } else if (item.option.selected) {
            selectedOptionHidden = true;
          }
        });

        if (selectedOptionHidden) {
          clientSelect.value = '';
        }

        updateSummary(visibleCount, query);
      }

      updateSummary(searchableOptions.length, '');
      searchInput.addEventListener('input', filterClients);
    });
  </script>
{% endblock %}
