{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Core Styles -->
    <link rel="stylesheet" href="{% static 'assets/vendors/mdi/css/materialdesignicons.min.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/htmx_table.css' %}" />
    <link rel="stylesheet" href="{% static 'css/chosen.css' %}" />
    <link rel="stylesheet" href="{% static 'css/base_rpts.css' %}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/3.6.0/mdb.min.css" />
    <link rel="shortcut icon" href="{% static 'images/file.png' %}" />
    {% include '_partials/layout_css.html' %}

    <title>
      {% block title %}
        Child Sponsorship Software
      {% endblock %}
    </title>

    <style>
      @media print {
        .print-hide {
          display: none;
        }
      }
    </style>
  </head>
  <body class="app-public-shell">
    <!-- Topbar -->
    {% block topbar %}
      {% include 'accounts/_partials/navbar.html' %}
    {% endblock %}

    <!-- Messages -->
    {% include '_partials/messages.html' %}

    <!-- Main Content -->
    <div class="container-fluid public-content-shell">
      {% block content %}

      {% endblock %}
    </div>

    <!-- Core Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.6.1/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/xlsx@0.15.1/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/3.6.0/mdb.min.js"></script>
    <script src="{% static 'js/print.js' %}"></script>
    <script src="{% static 'js/search_tbl.js' %}"></script>
    <script src="{% static 'js/htmx.js' %}"></script>
    <script src="{% static 'js/chosen.jquery.js' %}"></script>
    <script src="{% static 'js/btn_click.js' %}"></script>
    <script src="{% static 'js/disabled_btn.js' %}"></script>
    <script>
      $('.chzn-select').chosen()
      $('.chzn-select-deselect').chosen({ allow_single_deselect: true })
    </script>
  </body>
</html>
