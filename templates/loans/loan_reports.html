{% extends 'loans/base.html' %}
{% load static %}
{% load humanize %}

{% block content %}
  <div class="container my-4">
    <!-- Page Header -->
    <header class="text-center mb-5">
      <h2 class="text-uppercase fw-bold text-primary">{{ form_title }}</h2>
      <hr class="border-primary border-3 opacity-75 mx-auto w-100" />
    </header>

    <!-- Reports and Management Cards -->
    <section aria-labelledby="reports-title">
      <!-- First Row: Four Cards -->
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4 mb-4">
        <!-- Loan Portfolio Card -->
        <div class="col">
          <a href="{% url 'loans:loan_portfolio_report' %}" class="text-decoration-none" aria-label="View Loan Portfolio Report">
            <div class="card h-100 shadow-sm border-0">
              <div class="card-body text-center d-flex flex-column align-items-center justify-content-center">
                <i class="bi bi-clipboard-data fs-1 mb-3 text-primary"></i>
                <h5 class="card-title mb-0 fw-medium">Loan Portfolio</h5>
              </div>
            </div>
          </a>
        </div>

        <!-- Aging Report Card -->
        <div class="col">
          <a href="{% url 'loans:loan_aging_report' %}" class="text-decoration-none" aria-label="View Aging Report">
            <div class="card h-100 shadow-sm border-0">
              <div class="card-body text-center d-flex flex-column align-items-center justify-content-center">
                <i class="bi bi-bar-chart-line fs-1 mb-3 text-success"></i>
                <h5 class="card-title mb-0 fw-medium">Aging Report</h5>
              </div>
            </div>
          </a>
        </div>

        <!-- Arrears Report Card -->
        <div class="col">
          <a href="{% url 'loans:loan-arrears-report' %}" class="text-decoration-none" aria-label="View Arrears Report">
            <div class="card h-100 shadow-sm border-0">
              <div class="card-body text-center d-flex flex-column align-items-center justify-content-center">
                <i class="bi bi-people fs-1 mb-3 text-danger"></i>
                <h5 class="card-title mb-0 fw-medium">Arrears Report</h5>
              </div>
            </div>
          </a>
        </div>

        <!-- Portfolio at Risk (PAR) Card -->
        <div class="col">
          <a href="{% url 'loans:portfolio_at_risk_report' %}" class="text-decoration-none" aria-label="View Portfolio at Risk Report">
            <div class="card h-100 shadow-sm border-0">
              <div class="card-body text-center d-flex flex-column align-items-center justify-content-center">
                <i class="bi bi-exclamation-circle fs-1 mb-3 text-warning"></i>
                <h5 class="card-title mb-0 fw-medium">Portfolio at Risk</h5>
              </div>
            </div>
          </a>
        </div>
      </div>

      <!-- Second Row: Three Cards -->
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-3 g-4">
        <!-- Non-Performing Loans Card -->
        <div class="col">
          <a href="{% url 'loans:non_performing_loans' %}" class="text-decoration-none" aria-label="View Non-Performing Loans">
            <div class="card h-100 shadow-sm border-0">
              <div class="card-body text-center d-flex flex-column align-items-center justify-content-center">
                <i class="bi bi-exclamation-triangle fs-1 mb-3 text-danger"></i>
                <h5 class="card-title mb-0 fw-medium">Non-Performing Loans</h5>
              </div>
            </div>
          </a>
        </div>

        <!-- Chart of Accounts Card -->
        <div class="col">
          <a href="{% url 'loans:chart_of_accounts_list' %}" class="text-decoration-none" aria-label="View Chart of Accounts">
            <div class="card h-100 shadow-sm border-0">
              <div class="card-body text-center d-flex flex-column align-items-center justify-content-center">
                <i class="bi bi-table fs-1 mb-3 text-primary"></i>
                <h5 class="card-title mb-0 fw-medium">Chart of Accounts</h5>
              </div>
            </div>
          </a>
        </div>

        <!-- Loan Statements Card -->
        <div class="col">
          <a href="{% url 'loans:loan_statement' %}" class="text-decoration-none" aria-label="View Loan Statements">
            <div class="card h-100 shadow-sm border-0">
              <div class="card-body text-center d-flex flex-column align-items-center justify-content-center">
                <i class="bi bi-file-earmark-text fs-1 mb-3 text-secondary"></i>
                <h5 class="card-title mb-0 fw-medium">Loan Statements</h5>
              </div>
            </div>
          </a>
        </div>
      </div>
    </section>
  </div>
{% endblock %}
