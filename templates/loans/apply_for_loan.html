{% load crispy_forms_tags %}
{% block content %}
  {% include '_partials/main_nav.html' %}
  <!-- Loan Application Form -->
  <div class="container mt-5 pt-5">
    <div class="row mb-3">
      <div class="col-md-12 d-flex justify-content-between align-items-center">
        <h2 class="text-center mb-4">{{ form_title|upper }}</h2>
        <a href="{% url 'loans:loan_applications' %}" class="btn btn-info"><i class="mdi mdi-chart-bar"></i></a>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-md-12">
        <!-- =============== Messages Start ================= -->
        {% include '_partials/messages.html' %}
        <!-- =============== Messages End ================= -->
        <div class="card p-4 shadow-sm">
          <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="form-group mt-4 mb-0">
              <button type="submit" class="btn btn-dark w-100 text-uppercase" onclick="return confirm('Are you sure you want to proceed?') && validateForm()">Submit Application</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
