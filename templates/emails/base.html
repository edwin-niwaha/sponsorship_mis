<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default:"Pendeza Loan Notification" }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7fa;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .container {
            max-width: 620px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
            padding: 28px 24px;
            text-align: center;
        }
        .header h2 {
            margin: 0;
            font-size: 24px;
        }
        .content {
            padding: 28px 24px;
            font-size: 16px;
            line-height: 1.5;
        }
        .amount {
            font-family: Consolas, 'Courier New', monospace;
            font-weight: 600;
            color: #0d6efd;
            font-size: 1.1em;
        }
        .text-danger {
            color: #dc3545 !important;
        }
        .btn {
            display: inline-block;
            background: #198754;
            color: white;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            margin: 24px 0;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #157347;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
            font-size: 15px;
        }
        th, td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
        }
        .text-right {
            text-align: right;
        }
        .footer {
            padding: 20px;
            text-align: center;
            color: #6c757d;
            font-size: 14px;
            border-top: 1px solid #eee;
            background: #f8f9fa;
        }
        @media only screen and (max-width: 600px) {
            .container { margin: 10px; }
            .content { padding: 20px 16px; }
            .btn { width: 100%; text-align: center; box-sizing: border-box; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>{{ title }}</h2>
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    <div class="footer">
        Pendeza Uganda SACCO - Loan Management System<br>
        <small>This is an automated message. Please contact the loans team for support.</small>
    </div>
</div>
</body>
</html>
