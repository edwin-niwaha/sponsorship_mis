{% load static %}
<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="/">
      <img src="{% static 'images/file.png' %}" alt="Logo" class="me-2" height="40" width="40" />
      <span class="fw-bold">SDMS</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="/">HOME</a>
        </li>
        {% if user.is_authenticated and user.profile.role != 'guest' %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'main-dashboard' %}">DASHBOARD</a>
          </li>
        {% endif %}
      </ul>
      <ul class="navbar-nav ms-auto">
        {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link" href="{% url 'users-profile' %}">MY PROFILE</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'logout' %}" onclick="return confirm('Are you sure you want to logout?');">LOGOUT</a>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="nav-link fw-bold" href="{% url 'login' %}">SIGN IN</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-bold" href="{% url 'users-register' %}">SIGN UP</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
