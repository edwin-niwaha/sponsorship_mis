{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />

    <!-- CSS for Searchable dropdown -->
    <link rel="stylesheet" href="{% static 'css/chosen.css' %}" />

    <!-- Include Bootstrap CSS Pagination -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
      @media print {
        .print-hide {
          display: none;
        }
      }
    </style>
    {% include '_partials/layout_css.html' %}
    <title>
      {% block title %}Pendeza Connect{% endblock %}
    </title>
  </head>

  <body class="app-public-shell">
    <div class="container-scroller">
      <div class="container-fluid page-body-wrapper">
        <!-- Topbar -->
        {% include '_partials/guest_nav.html' %}

        <div class="main-panel">
          <div class="content-wrapper pb-0 app-page-container">
            <!-- Messages -->
            {% include '_partials/messages.html' %}

            {% block content %}

            {% endblock %}
          </div>
        </div>
      </div>
    </div>
  </body>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Print js -->
  <script src="{% static 'js/print.js' %}"></script>
  <script src="https://unpkg.com/xlsx@0.15.1/dist/xlsx.full.min.js"></script>

  <!-- Search table -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script type="text/javascript" src="{% static 'js/search_tbl.js' %}"></script>

  <!-- JS for Searchable dropdown -->
  <script type="text/javascript" src="{% static 'js/chosen.jquery.js' %}"></script>
  <script type="text/javascript">
    $('.chzn-select').chosen()
    $('.chzn-select-deselect').chosen({
      allow_single_deselect: true
    })
  </script>
</html>
