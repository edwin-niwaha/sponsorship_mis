{% if messages %}
  <div class="app-message-stack" role="region" aria-label="Notifications">
    {% for message in messages %}
      <div class="app-message {% if message.tags %}{{ message.tags }}{% endif %}" role="alert">
        <div class="app-message-content">
          <strong>Notification</strong>
          <span>{{ message }}</span>
        </div>
        <button type="button" class="app-message-close" aria-label="Close notification">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
    {% endfor %}
  </div>

  <style>
    .app-message-stack {
      display: grid;
      gap: 10px;
      left: 50%;
      max-width: min(560px, calc(100vw - 28px));
      position: fixed;
      top: 82px;
      transform: translateX(-50%);
      width: 100%;
      z-index: 2000;
    }

    .app-message {
      align-items: center;
      background: #fff;
      border: 1px solid #d9dee5;
      border-left: 5px solid #13745d;
      border-radius: 8px;
      box-shadow: 0 18px 36px rgba(31, 41, 51, .16);
      color: #1f344d;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      padding: 13px 14px;
    }

    .app-message.bg-success,
    .app-message.success {
      border-left-color: #13745d;
    }

    .app-message.bg-danger,
    .app-message.error,
    .app-message.danger {
      border-left-color: #dc3545;
    }

    .app-message.bg-warning,
    .app-message.warning {
      border-left-color: #f59e0b;
    }

    .app-message.bg-info,
    .app-message.info {
      border-left-color: #0ea5e9;
    }

    .app-message-content {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .app-message-content strong {
      color: #1f344d;
      font-size: .8rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .app-message-content span {
      color: #4b5563;
      font-size: .92rem;
      line-height: 1.4;
    }

    .app-message-close {
      align-items: center;
      background: #eef2f6;
      border: 0;
      border-radius: 50%;
      color: #1f344d;
      cursor: pointer;
      display: inline-flex;
      flex: 0 0 auto;
      font-size: 1.25rem;
      font-weight: 900;
      height: 30px;
      justify-content: center;
      line-height: 1;
      padding: 0;
      width: 30px;
    }

    .app-message-close:hover {
      background: #dde5ee;
      color: #111827;
    }

    @media (max-width: 767.98px) {
      .app-message-stack {
        top: 70px;
      }
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('.app-message-close').forEach(function (button) {
        button.addEventListener('click', function () {
          const message = button.closest('.app-message');
          if (message) {
            message.remove();
          }
        });
      });

      document.querySelectorAll('.app-message').forEach(function (message) {
        window.setTimeout(function () {
          if (message && message.parentNode) {
            message.remove();
          }
        }, 6500);
      });
    });
  </script>
{% endif %}
