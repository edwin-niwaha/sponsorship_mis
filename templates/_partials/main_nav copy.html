{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loan Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet" />

    <!-- CSS for Searchable dropdown -->
    <link rel="stylesheet" href="{% static 'css/chosen.css' %}" />

    <!-- Include Bootstrap CSS Pagination -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
      @media print {
        .print-hide {
          display: none;
        }
      }
    </style>
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="/">
          <img src="{% static 'images/file.png' %}" alt="Logo" class="me-2" height="40" width="40" />
          <span class="fw-bold">SDMS</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="/">HOME</a>
            </li>
            {% if user.is_authenticated and user.profile.role != 'guest' %}
              <li class="nav-item">
                <a class="nav-link" href="{% url 'main-dashboard' %}">MAIN-DASHBOARD</a>
              </li>
            {% endif %}
          </ul>
          <ul class="navbar-nav ms-auto">
            {% if user.is_authenticated %}
              <li class="nav-item">
                <a class="nav-link" href="{% url 'users-profile' %}">MY PROFILE</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{% url 'logout' %}" onclick="return confirm('Are you sure you want to logout?');">LOGOUT</a>
              </li>
            {% else %}
              <li class="nav-item">
                <a class="nav-link fw-bold" href="{% url 'login' %}">SIGN IN</a>
              </li>
              <li class="nav-item">
                <a class="nav-link fw-bold" href="{% url 'users-register' %}">SIGN UP</a>
              </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Print js -->
  <script type="text/javascript" src="{% static 'js/print.js' %}"></script>

  <!-- Search table -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script type="text/javascript" src="{% static 'js/search_tbl.js' %}"></script>

  <!-- JS for Searchable dropdown -->
  <script type="text/javascript" src="{% static 'js/chosen.jquery.js' %}"></script>
  <script type="text/javascript">
    $('.chzn-select').chosen()
    $('.chzn-select-deselect').chosen({
      allow_single_deselect: true
    })
  </script>
</html>
