{% extends '_partials/guest_base.html' %}
{% load crispy_forms_tags %}

{% block head %}

{% endblock %}

{% block content %}
  <!-- Loan Application Form -->
  <div class="container mt-5 pt-5">
    <div class="row mb-3">
      <div class="col-md-12 d-flex justify-content-between align-items-center">
        <h2 class="text-center mb-4">{{ form_name|upper }}</h2>
        <a href="{% url 'seven_hills_list' %}" class="btn btn-info"><i class="mdi mdi-chart-bar"></i></a>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-md-12">
        <div class="card p-4 shadow-sm">
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <!--  -->
            {{ form|crispy }}
            <div class="form-group mt-4 mb-0">
              <button type="submit" class="col-md-12 btn btn-dark" onclick="return confirm('Are you sure you want to proceed?') && validateForm()">REGISTER</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
